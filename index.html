<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدفع السريع - سويدان</title>

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .store-name {
            font-size: 26px;
            font-weight: bold;
            color: #0056b3;
            margin-bottom: 15px;
        }
        .wallet-box {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .wallet-title {
            font-size: 15px;
            font-weight: bold;
            color: #495057;
            margin-bottom: 8px;
        }
        .phone-number {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #212529;
            margin-bottom: 15px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn-copy {
            background-color: #198754;
            color: white;
        }
        .btn-copy:active {
            background-color: #146c43;
        }
        .form-group {
            text-align: right;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            box-sizing: border-box;
        }
        .btn-dial {
            background-color: #0d6efd;
            color: white;
            padding: 15px;
            font-size: 18px;
        }
        .btn-dial:active {
            background-color: #0b5ed7;
        }

            color: #6c757d;
            margin-top: 15px;
            line-height: 1.4;
        }
