<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدفع السريع</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; text-align: center; padding: 30px; }
        .box { background: #fff; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #0d6efd; }
        .phone { font-size: 24px; font-weight: bold; margin: 15px 0; color: #333; }
        input { width: 100%; padding: 12px; font-size: 18px; text-align: center; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px; }
        .btn { display: block; width: 100%; padding: 12px; background: #0d6efd; color: white; text-decoration: none; font-size: 18px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <h2>الدفع السريع - سويدان</h2>
    <div id="netName" style="font-weight: bold; color: #555;">جاري تحديد الشبكة...</div>
    <div class="phone" id="displayPhone">---</div>

    <input type="number" id="amount" placeholder="أدخل مبلغ التحويل" inputmode="numeric">

    <a href="#" id="payBtn" class="btn" onclick="startPay(event)">اتصال بكود الدفع</a>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const phone = urlParams.get('phone') || "01011617901";
    document.getElementById('displayPhone').innerText = phone;

    let prefix = "*9*7*";
    let name = "محفظة إلكترونية";

    if (phone.startsWith("010")) {
        name = "فودافون كاش";
        prefix = "*9*7*";
    } else if (phone.startsWith("011")) {
        name = "اتصالات كاش";
        prefix = "*777*1*";
    } else if (phone.startsWith("012")) {
        name = "أورنج كاش";
        prefix = "*115*1*";
    } else if (phone.startsWith("015")) {
        name = "وي باي";
        prefix = "*322*";
    }

    document.getElementById('netName').innerText = name;

    function startPay(e) {
        const amt = document.getElementById('amount').value;
        if (!amt) {
            alert("اكتب المبلغ الاول!");
            e.preventDefault();
            return;
        }
        let code = `${prefix}${phone}*${amt}#`.replace(/#/g, "%23");
        document.getElementById('payBtn').href = `tel:${code}`;
    }
</script>

</body>
</html>
