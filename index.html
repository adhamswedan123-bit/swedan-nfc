<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدفع السريع</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: #333;
            transition: background 0.4s ease;
        }
        /* خلفيات متدرجة خاصة بكل شركة */
        body.vf-theme { background: linear-gradient(135deg, #b30000, #ff1a1a, #e60000); }
        body.et-theme { background: linear-gradient(135deg, #00663b, #00ac69, #008751); }
        body.or-theme { background: linear-gradient(135deg, #cc6000, #ff7900, #ff9933); }
        body.we-theme { background: linear-gradient(135deg, #581c87, #7c3aed, #9333ea); }

        .card-container {
            background: #ffffff;
            width: 100%;
            max-width: 360px;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            text-align: center;
            margin: auto;
        }
        /* دايرة اللوجو */
        .logo-circle {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.12);
            border: 3px solid #f1f3f5;
            font-size: 24px;
            font-weight: bold;
            color: white;
        }
        .vf-bg { background-color: #e60000; }
        .et-bg { background-color: #00ac69; }
        .or-bg { background-color: #ff7900; }
        .we-bg { background-color: #7c3aed; }

        .wallet-badge {
            font-size: 20px;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .phone-display {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #0d6efd;
            margin-bottom: 20px;
            direction: ltr;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #495057;
            margin-bottom: 8px;
        }
        .amount-input {
            width: 100%;
            padding: 14px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #ced4da;
            border-radius: 12px;
            outline: none;
            background-color: #f8f9fa;
        }
        .amount-input:focus {
            border-color: #0d6efd;
            background-color: #fff;
        }
        .btn-pay {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.35);
        }
        .security-note {
            font-size: 11px;
            color: #856404;
            background-color: #fff3cd;
            padding: 10px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #ffeeba;
            line-height: 1.4;
        }
    </style>
</head>
<body id="pageBody">

<div class="card-container">
    <!-- دايرة اللوجو -->
    <div class="logo-circle" id="logoBox">
        <span id="netLogoText">NET</span>
    </div>

    <!-- اسم الشبكة ورقم التحويل -->
    <div class="wallet-badge" id="netName">جاري تحديد الشبكة...</div>
    <div class="phone-display" id="displayPhone">01000000000</div>

    <!-- إدخال المبلغ -->
    <div class="input-group">
        <label for="amount">مبلغ التحويل (بالجنيه):</label>
        <input type="number" id="amount" class="amount-input" placeholder="أدخل المبلغ هنا" inputmode="numeric">
    </div>

    <!-- زر الاتصال -->
    <a href="#" id="payBtn" class="btn-pay" onclick="startPay(event)">فتح شاشة الاتصال</a>

    <div class="security-note">
        🔒 تحويل مباشر وآمن عن طريق كود الخدمة الرسمية لشبكتك.
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const phone = urlParams.get('phone') || "01011617901";
    document.getElementById('displayPhone').innerText = phone;

    let prefix = "*9*7*";
    let name = "محفظة إلكترونية";
    let logoText = "PAY";
    let bgClass = "vf-bg";
    let themeClass = "vf-theme";

    if (phone.startsWith("010")) {
        name = "فودافون كاش";
        prefix = "*9*7*";
        logoText = "VF";
        bgClass = "vf-bg";
        themeClass = "vf-theme";
    } else if (phone.startsWith("011")) {
        name = "اتصالات كاش (e&)";
        prefix = "*777*1*";
        logoText = "e&";
        bgClass = "et-bg";
        themeClass = "et-theme";
    } else if (phone.startsWith("012")) {
        name = "أورنج كاش";
        prefix = "*115*1*";
        logoText = "OR";
        bgClass = "or-bg";
        themeClass = "or-theme";
    } else if (phone.startsWith("015")) {
        name = "وي باي (WE Pay)";
        prefix = "*322*";
        logoText = "WE";
        bgClass = "we-bg";
        themeClass = "we-theme";
    }

    document.getElementById('netName').innerText = name;
    document.getElementById('netLogoText').innerText = logoText;
    document.getElementById('logoBox').className = "logo-circle " + bgClass;
    document.getElementById('pageBody').className = themeClass;

    function startPay(e) {
        const amt = document.getElementById('amount').value;
        if (!amt) {
            alert("يرجى كتابة المبلغ أولاً!");
            e.preventDefault();
            return;
        }
        let code = `${prefix}${phone}*${amt}#`.replace(/#/g, "%23");
        document.getElementById('payBtn').href = `tel:${code}`;
    }
</script>

</body>
</html>
