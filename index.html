<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدفع السريع - سويدان</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .store-name {
            font-size: 26px;
            font-weight: bold;
            color: #0056b3;
            margin-bottom: 15px;
        }
        .wallet-box {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .wallet-title {
            font-size: 15px;
            font-weight: bold;
            color: #495057;
            margin-bottom: 8px;
        }
        .phone-number {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #212529;
            margin-bottom: 15px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn-copy {
            background-color: #198754;
            color: white;
        }
        .btn-copy:active {
            background-color: #146c43;
        }
        .form-group {
            text-align: right;
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            box-sizing: border-box;
        }
        .btn-dial {
            background-color: #0d6efd;
            color: white;
            padding: 15px;
            font-size: 18px;
        }
        .btn-dial:active {
            background-color: #0b5ed7;
        }
        .note {
            font-size: 12px;
            color: #6c757d;
            margin-top: 15px;
            line-height: 1.4;
        }
        .security-badge {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-top: 15px;
            border: 1px solid #ffeeba;
        }
    </style>
</head>
<body>

    <div class="container">
        <div style="font-size: 13px; color: #6c757d;">الدفع السريع للمحل</div>
        <div class="store-name">سويدان</div>

        <div class="wallet-box" id="walletBox">
            <div class="wallet-title" id="walletLabel">جاري تحديد الشبكة...</div>
            <div class="phone-number" id="storePhone">---</div>
            <button class="btn btn-copy" onclick="copyData()">نسخ رقم المحفظة</button>
        </div>

        <div class="form-group">
            <label for="amount">مبلغ التحويل بالجنيه *</label>
            <input type="number" id="amount" placeholder="أدخل المبلغ" inputmode="numeric">
        </div>

        <a href="#" id="dialLink" class="btn btn-dial" onclick="triggerDial(event)">فتح شاشة الاتصال بالكود</a>

        <div class="security-badge">
            لن يطلب منك هذا الموقع الرقم السري. أدخل الرقم السري فقط داخل خدمة الدفع الرسمية إذا طلبته منك. راجع اسم المستلم والمبلغ قبل التأكيد.
        </div>

        <div class="note">
            راجع الكود قبل استخدامه. تأكد من إدخال المبلغ الصحيح قبل الضغط على زر الاتصال.
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let storeNumber = urlParams.get('phone') || "01011617901"; 

        document.getElementById('storePhone').innerText = storeNumber;

        let currentPrefix = "*9*7*";
        let netName = "محفظة غير معروفة";
        let boxColor = "#f8f9fa";

        if (storeNumber.startsWith("010")) {
            netName = "فودافون كاش (Vodafone Cash)";
            currentPrefix = "*9*7*";
            boxColor = "#ffe6e6";
        } else if (storeNumber.startsWith("011")) {
            netName = "اتصالات كاش (Etisalat Cash)";
            currentPrefix = "*777*1*";
            boxColor = "#e6f9ff";
        } else if (storeNumber.startsWith("012")) {
            netName = "أورنج كاش (Orange Cash)";
            currentPrefix = "*115*1*";
            boxColor = "#fff3e6";
        } else if (storeNumber.startsWith("015")) {
            netName = "وي باي (WE Pay)";
            currentPrefix = "*322*";
            boxColor = "#f0e6ff";
        }

        document.getElementById('walletLabel').innerText = netName;
        document.getElementById('walletBox').style.backgroundColor = boxColor;

        function copyData() {
            navigator.clipboard.writeText(storeNumber);
            alert("تم نسخ الرقم: " + storeNumber);
        }

        function triggerDial(e) {
            const amount = document.getElementById('amount').value;
            if (!amount) {
                alert("يرجى إدخال مبلغ التحويل أولاً!");
                e.preventDefault();
                return;
            }

            let ussdCode = `${currentPrefix}${storeNumber}*${amount}#`;
            const encodedUssd = ussdCode.replace(/#/g, "%23");
            document.getElementById('dialLink').href = `tel:${encodedUssd}`;
        }
    </script>

</body>
</html>
