<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدفع السريع</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: #333;
        }
        .card-container {
            background: #ffffff;
            width: 100%;
            max-width: 360px;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            text-align: center;
            margin: auto;
        }
        /* دايرة اللوجو كأنها صورة بروفايل */
        .logo-circle {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.12);
            border: 3px solid #f1f3f5;
            overflow: hidden;
            padding: 12px;
        }
        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .wallet-badge {
            font-size: 20px;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .phone-display {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #0d6efd;
            margin-bottom: 20px;
            direction: ltr;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #495057;
            margin-bottom: 8px;
        }
        .amount-input {
            width: 100%;
            padding: 14px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #ced4da;
            border-radius: 12px;
            outline: none;
            background-color: #f8f9fa;
        }
        .amount-input:focus {
            border-color: #0d6efd;
            background-color: #fff;
        }
        .btn-pay {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.35);
        }
        .security-note {
            font-size: 11px;
            color: #856404;
            background-color: #fff3cd;
            padding: 10px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #ffeeba;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="card-container">
    <!-- دايرة اللوجو الرسمي -->
    <div class="logo-circle">
        <img id="netLogo" src="" alt="لوجو الشبكة">
    </div>

    <!-- اسم الشبكة ورقم التحويل -->
    <div class="wallet-badge" id="netName">جاري تحديد الشبكة...</div>
    <div class="phone-display" id="displayPhone">01000000000</div>

    <!-- إدخال المبلغ -->
    <div class="input-group">
        <label for="amount">مبلغ التحويل (بالجنيه):</label>
        <input type="number" id="amount" class="amount-input" placeholder="أدخل المبلغ هنا" inputmode="numeric">
    </div>

    <!-- زر الاتصال -->
    <a href="#" id="payBtn" class="btn-pay" onclick="startPay(event)">فتح شاشة الاتصال</a>

    <div class="security-note">
        🔒 تحويل مباشر وآمن عن طريق كود الخدمة الرسمية لشبكتك.
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const phone = urlParams.get('phone') || "01011617901";
    document.getElementById('displayPhone').innerText = phone;

    let prefix = "*9*7*";
    let name = "محفظة إلكترونية";
    let logoUrl = "";

    if (phone.startsWith("010")) {
        name = "فودافون كاش";
        prefix = "*9*7*";
        logoUrl = "https://upload.wikimedia.org/wikipedia/commons/1/18/Vodafone_Logo.svg";
    } else if (phone.startsWith("011")) {
        name = "اتصالات كاش (e&)";
        prefix = "*777*1*";
        logoUrl = "https://upload.wikimedia.org/wikipedia/commons/6/6b/Etisalat_Logo.svg";
    } else if (phone.startsWith("012")) {
        name = "أورنج كاش";
        prefix = "*115*1*";
        logoUrl = "https://upload.wikimedia.org/wikipedia/commons/c/c8/Orange_logo.svg";
    } else if (phone.startsWith("015")) {
        name = "وي باي (WE Pay)";
        prefix = "*322*";
        logoUrl = "https://upload.wikimedia.org/wikipedia/commons/8/86/Telecom_Egypt_logo.svg";
    }

    document.getElementById('netName').innerText = name;
    document.getElementById('netLogo').src = logoUrl;

    function startPay(e) {
        const amt = document.getElementById('amount').value;
        if (!amt) {
            alert("يرجى كتابة المبلغ أولاً!");
            e.preventDefault();
            return;
        }
        let code = `${prefix}${phone}*${amt}#`.replace(/#/g, "%23");
        document.getElementById('payBtn').href = `tel:${code}`;
    }
</script>

</body>
</html>
